name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and lua
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4

      - name: Lint
        run: shellcheck -S warning omarchy-webapps bin/* lib/*.sh install.sh uninstall.sh tests/test.sh

      - name: Test
        run: bash tests/test.sh
